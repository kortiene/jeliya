name: ci

# Every required technical-preview gate runs on pull requests, pushes to main,
# and release tags (through workflow_call). No gate is allowed to turn green by
# silently skipping a missing daemon or FFI library.

on:
  push:
    branches:
      - main
  pull_request:
  # Maintainers can run the same complete matrix twice on one immutable SHA
  # without entering the write-capable release workflow.
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs-ui:
    name: docs + TypeScript + release contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Verify documentation profile and navigation
        run: |
          set -euo pipefail
          node --test scripts/check-docs.test.mjs scripts/native-update-policy.test.mjs
          node scripts/check-docs.mjs

      - name: Verify secret-storage boundaries
        run: |
          set -euo pipefail
          node --test scripts/check-secret-storage.test.mjs
          node scripts/check-secret-storage.mjs

      - name: Verify release and installer contracts
        run: |
          set -euo pipefail
          node --test scripts/check-release.test.mjs scripts/check-installers.test.mjs \
            scripts/release-receipt.test.mjs scripts/finalize-release.test.mjs
          node scripts/check-release.mjs --source
          shellcheck scripts/finalize-release.sh
          shellcheck packaging/install.sh

      - name: Install TypeScript dependencies
        working-directory: ui
        run: npm ci

      # Verify the shared design-token fixture BEFORE anything renders against
      # it: assets/design-tokens.json is the one source both clients answer to,
      # and this half also enforces the shadow, side-stripe and gradient rules
      # DESIGN.md states as absolutes (issue #75).
      - name: Verify design-system conformance
        run: node scripts/check-design-tokens.mjs

      # Catalog completeness, French typography, and the never-translate
      # boundary for the web client (issue #74). The Flutter half is
      # `scripts/i18n-gate.mjs`, which runs in the flutter job and scans only
      # app/ — nothing had ever checked ui/.
      - name: Verify web localization catalogs
        run: |
          set -euo pipefail
          node --test scripts/check-ui-i18n.test.mjs
          node scripts/check-ui-i18n.mjs

      # The whole vitest suite EXCEPT the live-daemon oracle. Only the
      # mock-conformance file used to run here, so twelve other test files —
      # routing, the room list, attention, QR, landmarks, motion — had never
      # once run in CI and could not have failed a pull request (issue #76).
      #
      # The daemon oracle is excluded deliberately, not skipped: it hard-fails
      # when `target/debug/jeliyad` is absent, and that is the point — a
      # silently-skipped conformance suite reads as green while covering
      # nothing. This job never builds Rust, so the corpus runs in the job that
      # does, via `npm run test:conformance`.
      - name: TypeScript unit and mock conformance suite
        working-directory: ui
        run: npm run test:unit

      - name: TypeScript build
        working-directory: ui
        run: npm run build

  ui-e2e:
    name: UI browser regression (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install TypeScript dependencies
        working-directory: ui
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: ui
        run: npx playwright install --with-deps chromium

      # The responsive UX regression suite (ui/e2e) drives the real app against
      # the VITE_MOCK=1 fixture client across desktop and compact viewports —
      # no daemon required, so this gate cannot silently skip one.
      - name: Browser regression suite
        working-directory: ui
        run: npm run test:e2e

      # A failure has to carry the exact combination it failed under —
      # viewport, locale and text scale — or reproducing it means guessing.
      # e2e/fixtures.ts attaches those to every failing test, and the
      # accessibility specs attach the axe violation list alongside them.
      - name: Preserve failure evidence (screenshots, traces, console logs)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-evidence
          path: |
            ui/playwright-report
            ui/test-results
          retention-days: 14

  flutter:
    name: Flutter app + i18n
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.3'

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          # The generated-source drift gate is byte-exact. Bump this pin and
          # regenerate the committed files in the same change.
          flutter-version: 3.41.5
          cache: true

      - name: Verify generated sources, analysis, tests, and i18n
        working-directory: app
        run: |
          set -euo pipefail
          flutter pub get
          flutter gen-l10n
          test -z "$(git status --porcelain -- lib/src/l10n/gen)"
          node ../scripts/gen-l10n-parity.mjs
          test -z "$(git status --porcelain -- test/l10n_parity_test.dart)"
          flutter analyze
          flutter test
          node ../scripts/i18n-gate.mjs

      - name: Install verified Gradle
        env:
          GRADLE_VERSION: '8.14'
          GRADLE_DISTRIBUTION_SHA256: 61ad310d3c7d3e5da131b76bbf22b5a4c0786e9d892dae8c1658d4b484de3caa
        run: |
          set -euo pipefail
          archive="gradle-${GRADLE_VERSION}-bin.zip"
          curl --proto '=https' --tlsv1.2 --fail --location \
            --retry 3 --retry-all-errors \
            "https://services.gradle.org/distributions/$archive" \
            --output "$RUNNER_TEMP/$archive"
          printf '%s  %s\n' \
            "$GRADLE_DISTRIBUTION_SHA256" \
            "$RUNNER_TEMP/$archive" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/$archive" -d "$RUNNER_TEMP"
          printf '%s\n' "$RUNNER_TEMP/gradle-$GRADLE_VERSION/bin" >> "$GITHUB_PATH"

      - name: Compile Android protected-storage bridge
        working-directory: app
        run: |
          set -euo pipefail
          command -v gradle >/dev/null
          gradle -p android \
            :app:compileDebugKotlin \
            :app:processDebugMainManifest \
            --no-daemon

  linux-flutter:
    name: Linux Flutter app + bundled sidecar
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux desktop build and smoke dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            appstream \
            clang \
            cmake \
            desktop-file-utils \
            libgtk-3-dev \
            liblzma-dev \
            libstdc++-12-dev \
            ninja-build \
            pkg-config \
            xauth \
            xvfb

      - name: Setup Rust 1.96.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.96.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.8.2
        with:
          key: linux-flutter-sidecar

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.3'

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.41.5
          cache: true

      - name: Verify Linux packaging helpers
        run: node --test scripts/package-linux.test.mjs

      # The Flutter Linux app bundle, its v1 runtime exercise, and the v1
      # smoke/source-package contract are gated off: the app speaks the retired
      # v1 RPC protocol, which the v2-only daemon no longer serves, so it
      # cannot bootstrap and its smoke suite cannot run. The Flutter desktop
      # app is removed atomically under #201 (packaged Dioxus qualification);
      # the release-artifact contract moves to the Dioxus packaging slices
      # (#186, #187, #199). The deterministic packaging-helper unit tests above
      # continue to run; the v0.6.x release line keeps shipping the v1 bundle
      # from its own tags until then.

  rust-runtime:
    name: Rust + Dart + smoke + E2E + protocol conformance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust 1.96.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
          # The jeliya-client seam (#167) must link on wasm32; the shared Dioxus
          # component is built for this target below (AC-6).
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.8.2

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Rust format
        run: cargo fmt --all --check

      - name: Rust clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      # The jeliya-supervisor real-daemon tests (tests/supervision.rs) locate
      # `jeliyad` and SKIP when it is absent — a silent skip in CI reads as green
      # while covering nothing. Build it first and point the tests at it via
      # `JELIYAD_BIN`, so the full spawn/adopt/stop lifecycle actually runs.
      - name: Build jeliyad (the supervisor real-daemon tests require it)
        run: cargo build --locked -p jeliyad

      - name: Rust tests
        env:
          JELIYAD_BIN: ${{ github.workspace }}/target/debug/jeliyad
        run: cargo test --locked --workspace

      # The jeliya-client seam behaviour suite is behind the default-off `mock`
      # feature (so the library's normal build carries no test scaffolding), so
      # the workspace test run above compiles it to nothing. Run it explicitly.
      - name: jeliya-client seam behaviour suite (mock)
        run: cargo test --locked -p jeliya-client --features mock

      # The #168 kernel fault suite (and the kernel's feature-gated unit
      # tests) sit behind the default-off `test-transport` feature for the
      # same reason; the workspace run skips them, so run them explicitly.
      - name: jeliya-client kernel fault suite (test-transport)
        run: cargo test --locked -p jeliya-client --features test-transport

      # The #173 Android DirectClient adapter is behind the default-off,
      # native-only `direct` feature with optional deps (`tokio`, `jeliya-core`,
      # `jeliya-codec`), so the workspace run and the wasm build never compile
      # it. A default-off feature with no CI step never runs (the #172 review's
      # MUST-FIX lesson), so lint and test it explicitly on a native target.
      - name: jeliya-client DirectClient adapter (direct)
        run: |
          set -euo pipefail
          cargo clippy --locked -p jeliya-client --features direct --all-targets -- -D warnings
          cargo test --locked -p jeliya-client --features direct

      # AC-6: the minimal shared Dioxus component compiles against the mock for
      # both a native target and wasm32-unknown-unknown, with no per-component
      # cfg. The `example` feature enables the mock and pulls in the optional
      # Dioxus dependency; no renderer runs.
      - name: jeliya-client shared component builds (native + wasm32)
        run: |
          set -euo pipefail
          cargo build --locked -p jeliya-client --example shared_component --features example
          cargo build --locked -p jeliya-client --example shared_component --features example \
            --target wasm32-unknown-unknown

      # The #172 native WebSocket adapter (src/adapter/**, tests/ws_native_adapter.rs)
      # sits behind the default-off, native-only `ws-native` feature, so the
      # `--workspace` run above compiles it to nothing. Run its deterministic
      # integration suite explicitly — the step the crate manifest and spec §10.1
      # document — and lint it clippy-clean under the same feature with the
      # repo-standard `-D warnings`, so a regression in the adapter or its tests
      # goes red.
      - name: jeliya-client native WebSocket adapter (ws-native)
        run: |
          set -euo pipefail
          cargo clippy --locked -p jeliya-client --features ws-native --all-targets -- -D warnings
          cargo test --locked -p jeliya-client --features ws-native

      # The #174 PlatformServices behaviour suite (tests/capabilities.rs, AC-6)
      # drives the deterministic fakes behind the default-off `fake` feature, so
      # the `--workspace` run above compiles it to nothing. Run it explicitly —
      # the step the crate manifest documents — and lint it clippy-clean under
      # the same feature so an unused import in the fake-only suite goes red.
      - name: jeliya-platform behaviour suite (fake)
        run: |
          set -euo pipefail
          cargo clippy --locked -p jeliya-platform --features fake --all-targets -- -D warnings
          cargo test --locked -p jeliya-platform --features fake

      # The `implementation` factory surface (#174 §K4). Note that the
      # `--workspace` run above does NOT leave it uncompiled: the door crate
      # `jeliya-platform-implementation` is a workspace member, so selecting the
      # workspace unifies the feature onto the single `jeliya-platform` every
      # member links. What the workspace run does not do is exercise the surface
      # on its own or alongside `fake` — and the `fake,implementation`
      # combination is what compiles the forged-token case in
      # tests/capabilities.rs, the one proving a factory-built handle the
      # service never minted fails closed. The door crate is also built alone so
      # its re-export cannot rot silently.
      - name: jeliya-platform implementation surface and its door crate
        run: |
          set -euo pipefail
          cargo clippy --locked -p jeliya-platform --features implementation --all-targets -- -D warnings
          cargo clippy --locked -p jeliya-platform-implementation --all-targets -- -D warnings
          cargo test --locked -p jeliya-platform --features fake,implementation

      # The extended no-`cfg` boundary: the shared component
      # (examples/shared_component.rs) compiles against the injected
      # PlatformServices for both a native target and wasm32-unknown-unknown with
      # no per-component cfg — the direct analogue of the jeliya-client
      # two-target check. The `example` feature enables the fakes and pulls in
      # the optional Dioxus dependency; no renderer runs.
      - name: jeliya-platform shared component builds (native + wasm32)
        run: |
          set -euo pipefail
          cargo build --locked -p jeliya-platform --example shared_component --features example
          cargo build --locked -p jeliya-platform --example shared_component --features example \
            --target wasm32-unknown-unknown

      - name: Build required live-test binaries
        run: |
          set -euo pipefail
          cargo build --locked -p jeliyad
          test -x target/debug/jeliyad
          command -v lsof >/dev/null

      # The v1-coupled live suites (Dart protocol + FFI conformance, the
      # TypeScript v1 conformance oracle, and the Node v1 E2E scripts) drove the
      # retired v1 JSON protocol. The protocol-v2 cutover (#166) removes v1 with
      # no compatibility facade, so those suites no longer run against the
      # current daemon — they are retired atomically under #202/#203 and are
      # gated off here rather than left red. The v2 conformance corpus
      # (conformance/v2) is validated shape-wise by scripts/check-v2-corpus.mjs,
      # and the live replay harness runs against the real daemon.
      - name: Protocol-v2 conformance corpus shape validation
        run: |
          set -euo pipefail
          node --test scripts/check-v2-corpus.test.mjs
          node scripts/check-v2-corpus.mjs

      - name: Protocol-v2 conformance replay (handshake + subject lifecycle + file streams)
        run: |
          set -euo pipefail
          cd conformance/v2/harness
          npm ci --ignore-scripts
          # Run the handshake, subject-daemon, and executable file cases. The
          # replay harness exits non-zero on any unexpected failure or error;
          # the corpus's current coverage is tracked in the PR and grows as
          # the implementation fills the remaining v2 features. For now this
          # gate pins the reliably-green slice so a regression in the
          # implemented surface goes red. The file cases exercise the binary
          # byte-stream executor (upload streaming, pre-OPEN refusals with
          # bytes_streamed 0, and a declared-size-mismatch stream); the
          # at-limit and over-limit cases stream the served 100 MiB bound and
          # stay local-only.
          node main.mjs ../../../target/debug/jeliyad \
            --case subject_ensure_creates_the_subject_on_a_fresh_daemon \
            --case subject_ensure_never_returns_secret_material \
            --case subject_ensure_never_returns_identity_exists \
            --case hello_carries_subject_state_and_omits_pid_port_and_data_dir \
            --case subject_domain_frames_contain_no_json_null \
            --case a_frame_of_exactly_max_frame_bytes_is_parsed_and_answered_in_subject_daemon \
            --case a_frame_one_byte_past_max_frame_bytes_closes_4005_unparsed \
            --case outstanding_requests_at_and_past_max_inflight_requests \
            --case a_frame_with_no_recoverable_id_closes_4007_malformed_frame \
            --case daemon_stop_flushes_its_reply_before_teardown \
            --case daemon_stop_does_not_require_a_subject \
            --case room_list_without_a_subject_returns_subject_absent_not_an_empty_list \
            --case subject_absent_is_returned_before_any_effect_is_performed \
            --case subject_absent_outranks_room_not_available_and_is_not_a_membership_oracle \
            --case handshake_serves_the_file_and_transfer_limits_as_integers \
            --case share_one_byte_past_the_served_limit_is_refused_at_stage_declared \
            --case share_size_refusal_is_never_reported_as_digest_mismatch \
            --case share_completed_result_replays_without_a_second_stream_and_authors_once \
            --case a_stream_that_disagrees_with_its_declaration_is_declared_size_mismatch \
            --case list_of_a_room_that_is_not_available_answers_room_not_available \
            --case fetch_of_a_file_id_not_in_this_rooms_history_fails_with_file_unknown \
            --case transfer_cancel_of_an_unknown_op_id_fails_with_transfer_unknown

      # The network evidence harness (scripts/realnet-*.mjs) drove the retired
      # v1 WS protocol (`room.create`, `invite.create`, `message.send` over v1
      # frames). It is gated off with the other v1 live suites under #166 and
      # re-established on the v2 surface in a follow-up; the deterministic Rust
      # loopback/multi-room/late-join network tests in jeliya-core continue to
      # carry the live-network evidence in the meantime.

  msrv:
    name: MSRV 1.91.0
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust 1.91.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.91.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.8.2
        with:
          key: msrv-1.91.0

      - name: Verify exact compiler and workspace
        run: |
          set -euo pipefail
          rustc --version | grep '^rustc 1\.91\.0 '
          cargo check --locked --workspace --all-targets

  windows-installer:
    name: Windows installer integrity
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Parse and exercise checksum enforcement
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = (Resolve-Path 'packaging/install.ps1').Path
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            $installer,
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -ne 0) { throw ($parseErrors | Out-String) }

          $root = Join-Path $env:RUNNER_TEMP "jeliya-installer-$PID"
          $fixtures = Join-Path $root 'fixtures'
          $payload = Join-Path $root 'payload'
          New-Item -ItemType Directory -Force -Path $fixtures, $payload | Out-Null
          $asset = 'jeliyad-v9.8.7-x86_64-pc-windows-msvc.zip'
          $payloadExe = Join-Path $payload 'jeliyad.exe'
          Set-Content -LiteralPath $payloadExe -Value 'verified daemon fixture' -NoNewline
          $global:JeliyaFixtureArchive = Join-Path $fixtures $asset
          Compress-Archive -LiteralPath $payloadExe -DestinationPath $global:JeliyaFixtureArchive
          $digest = (Get-FileHash -LiteralPath $global:JeliyaFixtureArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          $global:JeliyaFixtureChecksum = Join-Path $fixtures "$asset.sha256"
          Set-Content -LiteralPath $global:JeliyaFixtureChecksum -Value "$digest  $asset" -Encoding ascii

          function global:Invoke-WebRequest {
            param(
              [string]$Uri,
              [string]$OutFile,
              [switch]$UseBasicParsing
            )
            $source = if ($Uri.EndsWith('.sha256')) {
              $global:JeliyaFixtureChecksum
            } else {
              $global:JeliyaFixtureArchive
            }
            Copy-Item -LiteralPath $source -Destination $OutFile
          }

          $env:JELIYA_VERSION = 'v9.8.7'
          $env:LOCALAPPDATA = Join-Path $root 'local-app-data'
          & $installer
          $installed = Join-Path $env:LOCALAPPDATA 'Programs\Jeliya\jeliyad.exe'
          if (-not (Test-Path $installed -PathType Leaf)) { throw 'verified installer did not install jeliyad.exe' }
          if ((Get-Content -LiteralPath $installed -Raw) -ne 'verified daemon fixture') {
            throw 'installed bytes differ from the verified fixture'
          }

          Remove-Item -LiteralPath $installed -Force
          Set-Content -LiteralPath $global:JeliyaFixtureArchive -Value 'tampered archive' -NoNewline
          $rejected = $false
          try {
            & $installer
          } catch {
            if ($_.Exception.Message -notmatch 'checksum mismatch') { throw }
            $rejected = $true
          }
          if (-not $rejected) { throw 'tampered archive was not rejected' }
          if (Test-Path $installed) { throw 'tampered archive produced an installed executable' }

          Remove-Item -LiteralPath $global:JeliyaFixtureArchive -Force
          Compress-Archive -LiteralPath $payloadExe -DestinationPath $global:JeliyaFixtureArchive
          $digest = (Get-FileHash -LiteralPath $global:JeliyaFixtureArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath $global:JeliyaFixtureChecksum -Value "$digest  $asset" -Encoding ascii
          $global:JeliyaSimulateReparse = $true
          function global:Expand-Archive {
            param(
              [string]$LiteralPath,
              [string]$DestinationPath,
              [switch]$Force
            )
            New-Item -ItemType Directory -Force -Path $DestinationPath | Out-Null
            Set-Content -LiteralPath (Join-Path $DestinationPath 'jeliyad.exe') `
              -Value 'simulated reparse payload' -NoNewline
          }
          function global:Get-ChildItem {
            param(
              [string]$LiteralPath,
              [switch]$Recurse,
              [switch]$File
            )
            if ($global:JeliyaSimulateReparse) {
              return [pscustomobject]@{
                Name = 'jeliyad.exe'
                Attributes = [System.IO.FileAttributes]::ReparsePoint
              }
            }
            Microsoft.PowerShell.Management\Get-ChildItem @PSBoundParameters
          }
          $reparseRejected = $false
          try {
            & $installer
          } catch {
            if ($_.Exception.Message -notmatch 'reparse point') { throw }
            $reparseRejected = $true
          }
          if (-not $reparseRejected) { throw 'reparse-point payload was not rejected' }
          if (Test-Path $installed) { throw 'reparse-point payload produced an installed executable' }

  dependency-security:
    name: dependency security (Cargo + npm)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust 1.96.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.96.0

      - name: Install cargo-audit
        uses: taiki-e/install-action@91ddec75689c4c78665b598d188dc821c5a43e5c # v2.85.9
        with:
          tool: cargo-audit@0.22.1

      - name: Cargo advisory audit
        run: cargo audit

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: npm high/critical advisory audit
        working-directory: ui
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm audit --audit-level=high

      # The #176 render-smoke Playwright tree is installed and EXECUTED by the
      # jeliya-ui-web job; an unaudited lockfile there would be a dependency
      # this gate never sees.
      - name: npm high/critical advisory audit (jeliya-ui render smoke)
        working-directory: crates/jeliya-ui/e2e
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm audit --audit-level=high

  jeliya-ui-web:
    # The #176 web-foundation gates, folded into one dedicated job so no new
    # REQUIRED check name is invented without confirming the branch-protection
    # contract (the required checks are load-bearing). This job runs and is
    # visible on every PR; make it required only after adding it to branch
    # protection. It asserts AC-1/AC-2/AC-3/AC-4/AC-5 executably; the offline
    # render smoke lives in crates/jeliya-ui/e2e and runs against the built dist.
    name: jeliya-ui web foundation (Dioxus, wasm32)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust 1.96.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.96.0
          # The reproducible browser artifact is built for wasm32; the
          # renderer stays out of the host-target jobs. clippy backs the
          # native-seam lint gate below.
          components: clippy
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.8.2
        with:
          key: jeliya-ui-web

      # A PINNED wasm-bindgen CLI (matching the locked wasm-bindgen), fetched as
      # a prebuilt binary — no `dx`, no OpenSSL. build-web.sh fails if the CLI
      # version does not equal the locked library version.
      - name: Install pinned wasm-bindgen-cli
        uses: taiki-e/install-action@91ddec75689c4c78665b598d188dc821c5a43e5c # v2.85.9
        with:
          tool: wasm-bindgen-cli@0.2.126

      # AC-5: CI cannot fetch an unpinned dx, and the canonical build depends on
      # no React/Vite/Flutter tooling and never reads ui/dist.
      - name: dx pin and no-React/Flutter-tooling (AC-5)
        run: |
          set -euo pipefail
          bash scripts/check-dx-pin.sh
          bash scripts/check-web-build-toolchain.sh

      # AC-2: the wasm32 `web` graph excludes Iroh and every native crate.
      - name: WASM graph excludes Iroh/native crates (AC-2)
        run: bash scripts/check-jeliya-ui-wasm-graph.sh

      # AC-1 + AC-3: the pinned Dioxus renderer builds reproducibly into one
      # canonical artifact whose assets are byte-identical across two clean
      # builds.
      - name: Reproducible build + deterministic assets (AC-1, AC-3)
        run: bash scripts/check-web-determinism.sh

      # AC-4: the shared stylesheet is consumed canonically from its single
      # source, and the artifact carries the Dioxus marker (not React output).
      - name: Shared CSS consumed canonically (AC-4)
        run: |
          set -euo pipefail
          bash scripts/build-web.sh
          cmp crates/jeliya-ui/dist/styles.css ui/src/styles.css
          grep -qx 'renderer=dioxus-web' crates/jeliya-ui/dist/.dioxus-artifact

      # The in-tree boundary invariants and the browser build itself.
      - name: Boundary tests and wasm build
        run: |
          set -euo pipefail
          cargo test --locked -p jeliya-ui --features ui
          cargo build --locked -p jeliya-ui --features web --target wasm32-unknown-unknown
          # The M4 seam stub must keep compiling lint-clean or the advertised
          # native boundary silently rots before #186-#189 pick it up.
          cargo clippy --locked -p jeliya-ui --features native -- -D warnings

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: crates/jeliya-ui/e2e/package-lock.json

      - name: Install Playwright and Chromium
        working-directory: crates/jeliya-ui/e2e
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      # The offline render smoke: serves crates/jeliya-ui/dist (built above by
      # the AC-4 step) on loopback with no network access and asserts the WASM
      # mounts the shell, the design system paints it, and the compose.rs mock
      # drives the client to the Ready state (boot screen gone, status footer
      # shows "Ready"). This is the only check that crosses the Rust mock →
      # WASM → DOM boundary end-to-end (#176 §11 Verification).
      - name: Offline render smoke (AC-1, AC-4)
        working-directory: crates/jeliya-ui/e2e
        run: npx playwright test

      - name: Preserve render smoke failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jeliya-ui-render-smoke-evidence
          path: |
            crates/jeliya-ui/e2e/playwright-report
            crates/jeliya-ui/e2e/test-results
          retention-days: 14

  # ---- #177 Dioxus catalog / literal / French-typography gates ----
  # Three independently-named contexts over ONE parser
  # (scripts/lib/jeliya-ui-catalog.mjs) so each AC-7 concern is its own required
  # branch-protection check. rustc already enforces key/placeholder parity between
  # jeliya_ui::l10n::En and ::Fr in the jeliya-ui-web job; these gates are the
  # defence in depth for what types cannot see. They read the Rust catalogs and
  # components as TEXT (no Rust build), so they cost seconds.
  #
  # IMPORTANT (branch protection): GitHub matches a required status check by its
  # check-RUN NAME, which is each job's `name:` value — NOT the job id. Add these
  # exact contexts to `main` protection after this merges (spec §6.3):
  #   - "jeliya-ui catalog parity (EN/FR)"                  (job ui-catalog)
  #   - "jeliya-ui literal copy (no hardcoded UI strings)"  (job ui-literal-copy)
  #   - "jeliya-ui French typography"                       (job ui-french-typography)
  #   - "jeliya-ui accessibility matrix (axe + keyboard)"   (job ui-a11y-foundation)
  # Requiring the job ids instead would never bind (no run publishes that name).
  ui-catalog:
    # Runs and is visible on every PR; not yet a branch-protection REQUIRED
    # context (add it after this merges — spec section 6.3). Kept out of the
    # documented required-job matrix the same way `jeliya-ui-web` is, so the
    # docs-truth check counts only the required jobs.
    name: jeliya-ui catalog parity (EN/FR)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.3'
      # The gate's own unit tests run FIRST — a gate whose rules are untested can
      # pass by being broken (check-ui-i18n.test.mjs makes the same argument).
      - name: Catalog gate self-tests + parity/empty/fr==en/plural
        run: |
          set -euo pipefail
          node --test scripts/check-jeliya-ui-i18n.test.mjs
          node scripts/check-jeliya-ui-i18n.mjs --only=catalog

  ui-literal-copy:
    # Not yet branch-protection REQUIRED (spec section 6.3); kept out of the
    # documented required-job matrix like `jeliya-ui-web`.
    name: jeliya-ui literal copy (no hardcoded UI strings)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.3'
      - name: No user-visible literal outside the catalog
        run: node scripts/check-jeliya-ui-i18n.mjs --only=literals

  ui-french-typography:
    # Not yet branch-protection REQUIRED (spec section 6.3); kept out of the
    # documented required-job matrix like `jeliya-ui-web`.
    name: jeliya-ui French typography
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.3'
      - name: U+202F / U+00A0 / U+2019 / U+2026 / guillemets over every fr value
        run: node scripts/check-jeliya-ui-i18n.mjs --only=typography

  ui-a11y-foundation:
    # The independently-named accessibility context AC-7 requires: the offline
    # axe + keyboard/focus matrix over the foundation routes at four viewports.
    # It also runs inside `jeliya-ui-web`'s full playwright pass, but that job is
    # not a11y-specific; this one exists so maintainers can require the check-run
    # name "jeliya-ui accessibility matrix (axe + keyboard)" in branch protection
    # (spec section 6.3) — the `name:` below is the context, NOT the `ui-a11y-foundation`
    # job id. Kept out of the documented required-job matrix like `jeliya-ui-web` until then.
    name: jeliya-ui accessibility matrix (axe + keyboard)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust 1.96.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.96.0
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.8.2
        with:
          key: jeliya-ui-a11y

      - name: Install pinned wasm-bindgen-cli
        uses: taiki-e/install-action@91ddec75689c4c78665b598d188dc821c5a43e5c # v2.85.9
        with:
          tool: wasm-bindgen-cli@0.2.126

      # Build the reproducible artifact the offline matrix serves.
      - name: Build the web artifact
        run: bash scripts/build-web.sh

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: crates/jeliya-ui/e2e/package-lock.json

      - name: Install Playwright and Chromium
        working-directory: crates/jeliya-ui/e2e
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      # Only the a11y projects (the four viewports), so this context is the
      # accessibility matrix and nothing else. The render smoke stays in the
      # `render` project inside jeliya-ui-web.
      - name: Accessibility matrix (axe critical/serious + keyboard/focus, 4 viewports)
        working-directory: crates/jeliya-ui/e2e
        run: npx playwright test --project=wide --project=medium --project=compact --project=narrow

      - name: Preserve accessibility failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jeliya-ui-a11y-evidence
          path: |
            crates/jeliya-ui/e2e/playwright-report
            crates/jeliya-ui/e2e/test-results
          retention-days: 14
