name: ci

# Every required technical-preview gate runs on pull requests, pushes to main,
# and release tags (through workflow_call). No gate is allowed to turn green by
# silently skipping a missing daemon or FFI library.

on:
  push:
    branches:
      - main
  pull_request:
  # Maintainers can run the same complete matrix twice on one immutable SHA
  # without entering the write-capable release workflow.
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs-ui:
    name: docs + TypeScript + release contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Verify documentation profile and navigation
        run: |
          set -euo pipefail
          node --test scripts/check-docs.test.mjs
          node scripts/check-docs.mjs

      - name: Verify secret-storage boundaries
        run: |
          set -euo pipefail
          node --test scripts/check-secret-storage.test.mjs
          node scripts/check-secret-storage.mjs

      - name: Verify release and installer contracts
        run: |
          set -euo pipefail
          node --test scripts/check-release.test.mjs scripts/check-installers.test.mjs \
            scripts/release-receipt.test.mjs scripts/finalize-release.test.mjs
          node scripts/check-release.mjs --source
          shellcheck scripts/finalize-release.sh
          shellcheck packaging/install.sh

      - name: Install TypeScript dependencies
        working-directory: ui
        run: npm ci

      # Verify the shared design-token fixture BEFORE anything renders against
      # it: assets/design-tokens.json is the one source both clients answer to,
      # and this half also enforces the shadow, side-stripe and gradient rules
      # DESIGN.md states as absolutes (issue #75).
      - name: Verify design-system conformance
        run: node scripts/check-design-tokens.mjs

      # Catalog completeness, French typography, and the never-translate
      # boundary for the web client (issue #74). The Flutter half is
      # `scripts/i18n-gate.mjs`, which runs in the flutter job and scans only
      # app/ — nothing had ever checked ui/.
      - name: Verify web localization catalogs
        run: |
          set -euo pipefail
          node --test scripts/check-ui-i18n.test.mjs
          node scripts/check-ui-i18n.mjs

      # The whole vitest suite EXCEPT the live-daemon oracle. Only the
      # mock-conformance file used to run here, so twelve other test files —
      # routing, the room list, attention, QR, landmarks, motion — had never
      # once run in CI and could not have failed a pull request (issue #76).
      #
      # The daemon oracle is excluded deliberately, not skipped: it hard-fails
      # when `target/debug/jeliyad` is absent, and that is the point — a
      # silently-skipped conformance suite reads as green while covering
      # nothing. This job never builds Rust, so the corpus runs in the job that
      # does, via `npm run test:conformance`.
      - name: TypeScript unit and mock conformance suite
        working-directory: ui
        run: npm run test:unit

      - name: TypeScript build
        working-directory: ui
        run: npm run build

  ui-e2e:
    name: UI browser regression (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install TypeScript dependencies
        working-directory: ui
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: ui
        run: npx playwright install --with-deps chromium

      # The responsive UX regression suite (ui/e2e) drives the real app against
      # the VITE_MOCK=1 fixture client across desktop and compact viewports —
      # no daemon required, so this gate cannot silently skip one.
      - name: Browser regression suite
        working-directory: ui
        run: npm run test:e2e

      # A failure has to carry the exact combination it failed under —
      # viewport, locale and text scale — or reproducing it means guessing.
      # e2e/fixtures.ts attaches those to every failing test, and the
      # accessibility specs attach the axe violation list alongside them.
      - name: Preserve failure evidence (screenshots, traces, console logs)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-evidence
          path: |
            ui/playwright-report
            ui/test-results
          retention-days: 14

  flutter:
    name: Flutter app + i18n
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.22.3'

      - name: Setup Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          # The generated-source drift gate is byte-exact. Bump this pin and
          # regenerate the committed files in the same change.
          flutter-version: 3.41.5
          cache: true

      - name: Verify generated sources, analysis, tests, and i18n
        working-directory: app
        run: |
          set -euo pipefail
          flutter pub get
          flutter gen-l10n
          test -z "$(git status --porcelain -- lib/src/l10n/gen)"
          node ../scripts/gen-l10n-parity.mjs
          test -z "$(git status --porcelain -- test/l10n_parity_test.dart)"
          flutter analyze
          flutter test
          node ../scripts/i18n-gate.mjs

      - name: Install verified Gradle
        env:
          GRADLE_VERSION: '8.14'
          GRADLE_DISTRIBUTION_SHA256: 61ad310d3c7d3e5da131b76bbf22b5a4c0786e9d892dae8c1658d4b484de3caa
        run: |
          set -euo pipefail
          archive="gradle-${GRADLE_VERSION}-bin.zip"
          curl --proto '=https' --tlsv1.2 --fail --location \
            --retry 3 --retry-all-errors \
            "https://services.gradle.org/distributions/$archive" \
            --output "$RUNNER_TEMP/$archive"
          printf '%s  %s\n' \
            "$GRADLE_DISTRIBUTION_SHA256" \
            "$RUNNER_TEMP/$archive" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/$archive" -d "$RUNNER_TEMP"
          printf '%s\n' "$RUNNER_TEMP/gradle-$GRADLE_VERSION/bin" >> "$GITHUB_PATH"

      - name: Compile Android protected-storage bridge
        working-directory: app
        run: |
          set -euo pipefail
          command -v gradle >/dev/null
          gradle -p android \
            :app:compileDebugKotlin \
            :app:processDebugMainManifest \
            --no-daemon

  linux-flutter:
    name: Linux Flutter app + bundled sidecar
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux desktop build and smoke dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            appstream \
            clang \
            cmake \
            desktop-file-utils \
            libgtk-3-dev \
            liblzma-dev \
            libstdc++-12-dev \
            ninja-build \
            pkg-config \
            xauth \
            xvfb

      - name: Setup Rust 1.96.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.96.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.8.2
        with:
          key: linux-flutter-sidecar

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.22.3'

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.41.5
          cache: true

      - name: Verify Linux packaging helpers
        run: node --test scripts/package-linux.test.mjs

      # The Flutter Linux app bundle, its v1 runtime exercise, and the v1
      # smoke/source-package contract are gated off: the app speaks the retired
      # v1 RPC protocol, which the v2-only daemon no longer serves, so it
      # cannot bootstrap and its smoke suite cannot run. The Flutter desktop
      # app is removed atomically under #201 (packaged Dioxus qualification);
      # the release-artifact contract moves to the Dioxus packaging slices
      # (#186, #187, #199). The deterministic packaging-helper unit tests above
      # continue to run; the v0.6.x release line keeps shipping the v1 bundle
      # from its own tags until then.

  rust-runtime:
    name: Rust + Dart + smoke + E2E + protocol conformance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust 1.96.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.8.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Rust format
        run: cargo fmt --all --check

      - name: Rust clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --locked --workspace

      - name: Build required live-test binaries
        run: |
          set -euo pipefail
          cargo build --locked -p jeliyad
          test -x target/debug/jeliyad
          command -v lsof >/dev/null

      # The v1-coupled live suites (Dart protocol + FFI conformance, the
      # TypeScript v1 conformance oracle, and the Node v1 E2E scripts) drove the
      # retired v1 JSON protocol. The protocol-v2 cutover (#166) removes v1 with
      # no compatibility facade, so those suites no longer run against the
      # current daemon — they are retired atomically under #202/#203 and are
      # gated off here rather than left red. The v2 conformance corpus
      # (conformance/v2) is validated shape-wise by scripts/check-v2-corpus.mjs,
      # and the live replay harness runs against the real daemon.
      - name: Protocol-v2 conformance corpus shape validation
        run: |
          set -euo pipefail
          node --test scripts/check-v2-corpus.test.mjs
          node scripts/check-v2-corpus.mjs

      - name: Protocol-v2 conformance replay (handshake + subject lifecycle + file streams)
        run: |
          set -euo pipefail
          cd conformance/v2/harness
          npm ci --ignore-scripts
          # Run the handshake, subject-daemon, and executable file cases. The
          # replay harness exits non-zero on any unexpected failure or error;
          # the corpus's current coverage is tracked in the PR and grows as
          # the implementation fills the remaining v2 features. For now this
          # gate pins the reliably-green slice so a regression in the
          # implemented surface goes red. The file cases exercise the binary
          # byte-stream executor (upload streaming, pre-OPEN refusals with
          # bytes_streamed 0, and a declared-size-mismatch stream); the
          # at-limit and over-limit cases stream the served 100 MiB bound and
          # stay local-only.
          node main.mjs ../../../target/debug/jeliyad \
            --case subject_ensure_creates_the_subject_on_a_fresh_daemon \
            --case subject_ensure_never_returns_secret_material \
            --case subject_ensure_never_returns_identity_exists \
            --case hello_carries_subject_state_and_omits_pid_port_and_data_dir \
            --case subject_domain_frames_contain_no_json_null \
            --case a_frame_of_exactly_max_frame_bytes_is_parsed_and_answered_in_subject_daemon \
            --case a_frame_one_byte_past_max_frame_bytes_closes_4005_unparsed \
            --case outstanding_requests_at_and_past_max_inflight_requests \
            --case a_frame_with_no_recoverable_id_closes_4007_malformed_frame \
            --case daemon_stop_flushes_its_reply_before_teardown \
            --case daemon_stop_does_not_require_a_subject \
            --case room_list_without_a_subject_returns_subject_absent_not_an_empty_list \
            --case subject_absent_is_returned_before_any_effect_is_performed \
            --case subject_absent_outranks_room_not_available_and_is_not_a_membership_oracle \
            --case handshake_serves_the_file_and_transfer_limits_as_integers \
            --case share_one_byte_past_the_served_limit_is_refused_at_stage_declared \
            --case share_size_refusal_is_never_reported_as_digest_mismatch \
            --case share_completed_result_replays_without_a_second_stream_and_authors_once \
            --case a_stream_that_disagrees_with_its_declaration_is_declared_size_mismatch \
            --case list_of_a_room_that_is_not_available_answers_room_not_available \
            --case fetch_of_a_file_id_not_in_this_rooms_history_fails_with_file_unknown \
            --case transfer_cancel_of_an_unknown_op_id_fails_with_transfer_unknown

      # The network evidence harness (scripts/realnet-*.mjs) drove the retired
      # v1 WS protocol (`room.create`, `invite.create`, `message.send` over v1
      # frames). It is gated off with the other v1 live suites under #166 and
      # re-established on the v2 surface in a follow-up; the deterministic Rust
      # loopback/multi-room/late-join network tests in jeliya-core continue to
      # carry the live-network evidence in the meantime.

  msrv:
    name: MSRV 1.91.0
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust 1.91.0
        uses: dtolnay/rust-toolchain@ad7910d95e317a4b12a9a3dfad520f4b409b3ec0 # 1.91.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.8.2
        with:
          key: msrv-1.91.0

      - name: Verify exact compiler and workspace
        run: |
          set -euo pipefail
          rustc --version | grep '^rustc 1\.91\.0 '
          cargo check --locked --workspace --all-targets

  windows-installer:
    name: Windows installer integrity
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Parse and exercise checksum enforcement
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = (Resolve-Path 'packaging/install.ps1').Path
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            $installer,
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -ne 0) { throw ($parseErrors | Out-String) }

          $root = Join-Path $env:RUNNER_TEMP "jeliya-installer-$PID"
          $fixtures = Join-Path $root 'fixtures'
          $payload = Join-Path $root 'payload'
          New-Item -ItemType Directory -Force -Path $fixtures, $payload | Out-Null
          $asset = 'jeliyad-v9.8.7-x86_64-pc-windows-msvc.zip'
          $payloadExe = Join-Path $payload 'jeliyad.exe'
          Set-Content -LiteralPath $payloadExe -Value 'verified daemon fixture' -NoNewline
          $global:JeliyaFixtureArchive = Join-Path $fixtures $asset
          Compress-Archive -LiteralPath $payloadExe -DestinationPath $global:JeliyaFixtureArchive
          $digest = (Get-FileHash -LiteralPath $global:JeliyaFixtureArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          $global:JeliyaFixtureChecksum = Join-Path $fixtures "$asset.sha256"
          Set-Content -LiteralPath $global:JeliyaFixtureChecksum -Value "$digest  $asset" -Encoding ascii

          function global:Invoke-WebRequest {
            param(
              [string]$Uri,
              [string]$OutFile,
              [switch]$UseBasicParsing
            )
            $source = if ($Uri.EndsWith('.sha256')) {
              $global:JeliyaFixtureChecksum
            } else {
              $global:JeliyaFixtureArchive
            }
            Copy-Item -LiteralPath $source -Destination $OutFile
          }

          $env:JELIYA_VERSION = 'v9.8.7'
          $env:LOCALAPPDATA = Join-Path $root 'local-app-data'
          & $installer
          $installed = Join-Path $env:LOCALAPPDATA 'Programs\Jeliya\jeliyad.exe'
          if (-not (Test-Path $installed -PathType Leaf)) { throw 'verified installer did not install jeliyad.exe' }
          if ((Get-Content -LiteralPath $installed -Raw) -ne 'verified daemon fixture') {
            throw 'installed bytes differ from the verified fixture'
          }

          Remove-Item -LiteralPath $installed -Force
          Set-Content -LiteralPath $global:JeliyaFixtureArchive -Value 'tampered archive' -NoNewline
          $rejected = $false
          try {
            & $installer
          } catch {
            if ($_.Exception.Message -notmatch 'checksum mismatch') { throw }
            $rejected = $true
          }
          if (-not $rejected) { throw 'tampered archive was not rejected' }
          if (Test-Path $installed) { throw 'tampered archive produced an installed executable' }

          Remove-Item -LiteralPath $global:JeliyaFixtureArchive -Force
          Compress-Archive -LiteralPath $payloadExe -DestinationPath $global:JeliyaFixtureArchive
          $digest = (Get-FileHash -LiteralPath $global:JeliyaFixtureArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath $global:JeliyaFixtureChecksum -Value "$digest  $asset" -Encoding ascii
          $global:JeliyaSimulateReparse = $true
          function global:Expand-Archive {
            param(
              [string]$LiteralPath,
              [string]$DestinationPath,
              [switch]$Force
            )
            New-Item -ItemType Directory -Force -Path $DestinationPath | Out-Null
            Set-Content -LiteralPath (Join-Path $DestinationPath 'jeliyad.exe') `
              -Value 'simulated reparse payload' -NoNewline
          }
          function global:Get-ChildItem {
            param(
              [string]$LiteralPath,
              [switch]$Recurse,
              [switch]$File
            )
            if ($global:JeliyaSimulateReparse) {
              return [pscustomobject]@{
                Name = 'jeliyad.exe'
                Attributes = [System.IO.FileAttributes]::ReparsePoint
              }
            }
            Microsoft.PowerShell.Management\Get-ChildItem @PSBoundParameters
          }
          $reparseRejected = $false
          try {
            & $installer
          } catch {
            if ($_.Exception.Message -notmatch 'reparse point') { throw }
            $reparseRejected = $true
          }
          if (-not $reparseRejected) { throw 'reparse-point payload was not rejected' }
          if (Test-Path $installed) { throw 'reparse-point payload produced an installed executable' }

  dependency-security:
    name: dependency security (Cargo + npm)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust 1.96.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.96.0

      - name: Install cargo-audit
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          tool: cargo-audit@0.22.1

      - name: Cargo advisory audit
        run: cargo audit

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: npm high/critical advisory audit
        working-directory: ui
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm audit --audit-level=high
