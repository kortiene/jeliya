[package]
name = "jeliya-ui"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Shared Dioxus 0.7 UI crate for the Jeliya clean-slate stack (#176): the production-shaped, system-WebView-targeted component library and application root that consumes jeliya-api view models, the jeliya-client ClientHandle seam, and an injected PlatformServices boundary, with target composition selected only at the crate root. The browser (wasm32) graph is Iroh-free and native-free; the renderer is optional and feature-gated so the default build carries no Dioxus, no OpenSSL, and compiles on the workspace MSRV."

[features]
# Deliberately empty. The default build is host-compilable on the workspace
# MSRV (1.91), renderer-free and OpenSSL-free: it pulls no Dioxus, so the
# `cargo check --locked --workspace --all-targets` MSRV job and every existing
# host-target job compile `jeliya-ui` to (essentially) nothing and never need
# `libssl-dev`. The shared component library, the app root, and the state
# model all live behind the `ui` feature — exactly the discipline
# `jeliya-client` uses for its verification component (`example`).
default = []

# The shared, renderer-agnostic UI surface: RSX components, `app_root`, the
# view-model state fold, and the provisional `PlatformServices` seam. It pulls
# the OPTIONAL `dioxus` dependency with only `minimal` (macro + signals +
# hooks + html) so the components link on native and wasm32 alike WITHOUT a
# renderer, `tao`/`wry`, or OpenSSL. It also enables `jeliya-client`'s
# deterministic mock, because #176 renders against the mock (the reference
# behaviour) — the real browser transport (`WsWeb`) is #168 and slots in
# behind the same `ClientHandle` later.
ui = [
    "dep:dioxus",
    "dioxus/minimal",
    # `mounted` is LOAD-BEARING for the dialog focus contract (#177): without
    # it, `onmounted`/`set_focus` compile against the silent no-op fallback
    # backing and never fire. It adds no dependency to the lockfile.
    "dioxus/mounted",
    "dep:futures",
    "jeliya-client/mock",
    # The canonical platform-authority contract (#174) and its deterministic
    # fakes. `jeliya-platform` is renderer-agnostic and wasm32-clean by
    # construction, so it enters the browser graph without pulling any native
    # crate (asserted by `jeliya-platform`'s own boundary tests and this
    # crate's wasm-graph check).
    "dep:jeliya-platform",
    "jeliya-platform/fake",
]

# The browser DOM renderer. Built ONLY for `wasm32-unknown-unknown`, in the
# dedicated web job. It adds `dioxus/web` on top of `ui`; it must never pull
# `dioxus-desktop`/`wry`/`tao`/`tokio`/`openssl-sys` (asserted by
# `scripts/check-jeliya-ui-wasm-graph.sh`).
web = ["ui", "dioxus/web", "dep:web-sys", "dep:wasm-bindgen", "dep:js-sys"]

# The system-WebView shell target (M4: #186-#189). This slice defines the
# layering seam — `compose.rs` carries the mock-composed `NativeComposition` /
# `NativeRoot` stub (compile-gated on this feature, checked in CI) that M4
# plugs its renderer, live adapter, and real `PlatformServices` into — but
# does NOT build or ship the shell. The concrete system-WebView renderer
# (`dioxus-desktop`, which declares `tungstenite` with `native-tls` and so
# links `openssl-sys` non-optionally for every non-Android target) is wired in
# by the M4 packaging slices, deliberately kept out of the default and
# CI-workspace graphs so no host job regresses or needs system OpenSSL headers.
native = ["ui"]

[dependencies]
# All request/output/push/error/view-model types come from jeliya-api. This
# crate defines no second spelling of any wire type. jeliya-api is already
# wasm32-clean (no Iroh/WebSocket/Dioxus, no `serde_json::Value` in public
# types), so it links in the browser graph by construction.
jeliya-api = { path = "../jeliya-api" }
# The single UI-facing client contract: the cloneable, lifecycle-aware
# `ClientHandle`. Transport-independent and wasm32-safe; `#176` drives it with
# the deterministic mock (enabled by the `ui` feature). No Iroh, no WebSocket,
# no native transport enters through it.
jeliya-client = { path = "../jeliya-client" }
# The canonical injectable `PlatformServices` boundary (#174). Optional and
# enabled only by the `ui` feature (with its `fake` feature), so the default
# build stays renderer-free and this dependency never enters the MSRV
# `--workspace --all-targets` graph. It is wasm32-clean and native-free by
# construction, so it links in the browser `web` graph.
jeliya-platform = { path = "../jeliya-platform", optional = true }
# Optional and feature-gated, exactly like `jeliya-client`'s example dep, so a
# bare `cargo check --all-targets` (MSRV + clippy) never compiles a renderer.
# `default-features = false` keeps the base graph minimal; the `ui`/`web`
# features select `minimal`/`web` explicitly. Pinned to the 0.7.9 line the
# architecture record selects and the root `Cargo.lock` already resolves.
dioxus = { version = "=0.7.9", default-features = false, optional = true }
# Web-only, gated by the `web` feature: read the browser UI language
# (`navigator.language`) at composition to seed locale resolution (#177). Already
# in the lock via `dioxus-web`; declaring it directly only enables the
# Window/Navigator bindings and never enters the default/`ui`/MSRV graph.
# `History`/`EventTarget`/`Event`/`VisibilityState` are added for #178's browser
# navigation + lifecycle bindings (History-API push/replace, popstate,
# visibilitychange/pagehide). All resolve within the already-locked `web-sys`
# crate — new feature flags, not a new dependency, so the wasm graph gains no
# edge (asserted by `scripts/check-jeliya-ui-wasm-graph.sh`).
web-sys = { version = "0.3.103", optional = true, features = ["Window", "Navigator", "Document", "Element", "Location", "Storage", "History", "EventTarget", "Event", "VisibilityState"] }
# Web-only, gated by `web`: install a marker-gated e2e hook (`window.__jeliyaE2eConnState`)
# that drives the mock's connection lifecycle so the a11y matrix can verify the connection
# live-region announce-once wiring against a REAL transition. Same compiled-in-but-armed-
# only-by-the-e2e-`localStorage`-marker pattern as the `?boot=` fixture; inert in production.
# Both already resolve in the lock via `dioxus-web`/`web-sys`, so declaring them directly
# adds nothing new to the wasm graph and never enters the default/`ui`/MSRV graph.
wasm-bindgen = { version = "0.2.126", optional = true }
js-sys = { version = "0.3.103", optional = true }
# Executor-agnostic, wasm32-safe async primitives for the app root's event
# consumption (`StreamExt`, `join!`). Optional and enabled by `ui`; the base
# graph (already carrying `futures` via `jeliya-client`) is unchanged.
futures = { version = "0.3", default-features = false, features = ["std", "async-await"], optional = true }

[dev-dependencies]
# Needed by the compose_shape integration test to name `Durability`, `Preferences`,
# `PrivateDirectory`, and `WindowActions` — types that `jeliya-ui` re-exports only
# partially. The `fake` feature is active transitively through the `ui` feature
# (which enables `jeliya-platform/fake`), so the test binary sees the full library.
jeliya-platform = { path = "../jeliya-platform" }

# Underscored so the cargo artifact, the wasm-bindgen module, and the import in
# `index.html` all agree on one name (the #158 spike's convention).
[[bin]]
name = "jeliya_ui_web"
path = "src/bin/web.rs"
# The browser entry point launches the DOM renderer, so it only exists when the
# `web` feature (and thus `dioxus/web`) is enabled. `--all-targets` on the MSRV
# and clippy jobs skips it because its required feature is off there.
required-features = ["web"]

# The composition-shape end-to-end test verifies that web_composition() and
# native_composition() inject the correct PlatformServices shape (browser vs.
# desktop) into AppRoot. It requires `ui` to compile (compose.rs is feature-gated
# on `ui`).
[[test]]
name = "compose_shape"
required-features = ["ui"]

# Focused integration tests for #178 (bootstrap, shell, routing, preferences).
# Covers the CSS-parity guard, the AC-6 legacy-reader source scan, and the
# navigate_replace/NavigatedReplace distinction (D4). Requires `ui` for access
# to `jeliya_ui::shell` / `jeliya_ui::prefs` and `jeliya_platform::fake`.
[[test]]
name = "shell_178"
required-features = ["ui"]

[lints]
workspace = true
