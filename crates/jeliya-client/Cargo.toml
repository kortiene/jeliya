[package]
name = "jeliya-client"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Lifecycle-aware UI-facing client seam for Jeliya protocol v2: one cloneable ClientHandle with compile-time-paired calls, an honest client State model, multi-consumer events, a may-have-executed error taxonomy, and a deterministic in-process mock. No Iroh, no WebSocket, no Dioxus in the library."

[features]
# The deterministic mock ships with the seam but stays default-off so the
# library's normal build carries no test scaffolding. The seam behaviour suite
# and the example enable it. The feature adds no dependencies — the mock is
# hand-rolled and clock-free.
mock = []
# The verification component (examples/shared_component.rs) needs Dioxus. This
# feature pulls it in as an OPTIONAL dependency so that a bare
# `cargo check/clippy --all-targets` — the MSRV (1.91) and clippy jobs — never
# compiles the heavy UI-framework tree: an optional dependency is built only
# when its feature is enabled, unlike a dev-dependency, which `--all-targets`
# would build unconditionally. The dedicated example-build CI steps pass
# `--features example`.
example = ["mock", "dep:dioxus"]
# The deterministic in-memory kernel driver (#168) and its `KernelController`
# ship behind this feature, default-off, so the library's normal build carries
# no test scaffolding — exactly like `mock`. It adds no dependencies: the
# driver is a hand-rolled, clock-free, RNG-free virtual transport. The kernel
# core itself is unconditional production code; only the in-memory reference
# driver and controller are gated here so #175's parity suite and the kernel's
# own fault suite can reuse them. CI runs the kernel suite with
# `cargo test -p jeliya-client --features test-transport`.
test-transport = []
# The native async WebSocket adapter (#172): binds the sans-IO kernel to a real
# tokio + tokio-tungstenite transport that dials a loopback `jeliyad` via the
# reusable supervisor target resolver (#170). Default-off and native-only — the
# web (wasm32) build must NEVER enable it, or `tokio`/`tokio-tungstenite`/
# `jeliya-supervisor` would enter the wasm graph. `tests/boundaries.rs` asserts
# both that the default library tree stays transport-free and that the
# `jeliya-ui` `web` wasm graph never names these crates. The adapter lives under
# `src/adapter/**` (outside `src/kernel/**`/`src/reconcile/**`), so it may use
# `tokio`/`std::time` without tripping the sans-IO scans. CI runs it with
# `cargo test -p jeliya-client --features ws-native`.
ws-native = ["dep:tokio", "dep:tokio-tungstenite", "dep:http", "dep:url", "dep:jeliya-codec", "dep:jeliya-supervisor"]

[dependencies]
jeliya-api = { path = "../jeliya-api" }
# `serde_json` is confined to the erased `RawJson` boundary in `handle.rs` and
# the mock; it never appears in a public signature (asserted by
# `tests/boundaries.rs`).
serde_json = "1"
thiserror = "2"
# Executor-agnostic, wasm32-safe primitives only: `Stream` for the event
# subscription, `oneshot` for reply correlation, `BoxFuture` for the erased
# backend. No `tokio`, no runtime, no `executor` feature in the library.
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
# Optional, and only for the verification component: the core `dioxus` crate
# for RSX + `#[component]`, never a renderer. It is behind the `example`
# feature (default-off) so it is never part of the library's own build — the
# seam stays transport- and UI-framework-independent, asserted by
# `tests/boundaries.rs` scanning the library's normal, no-default-features
# dependency edges. `minimal` gives the macro, signals, and hooks without
# pulling `tao`/`wry`/a web renderer, so the component links on native and
# wasm32 alike.
dioxus = { version = "=0.7.9", default-features = false, features = ["minimal"], optional = true }
# --- ws-native adapter (#172), all optional + default-off + native-only ---
# `rt` (not `rt-multi-thread`): the adapter BORROWS the caller's runtime via a
# captured `Handle` and `tokio::spawn`; it never constructs a runtime (the same
# rule the supervisor follows). No `macros`.
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "io-util", "sync"], optional = true }
# Aligned to the daemon's `tokio-tungstenite = "0.30"` (already in the lock), so
# no new major and no server/client version drift.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect"], optional = true }
# Build the upgrade `Request` and its `Authorization`/`Host` headers. Same major
# (`http = 1`) tungstenite resolves to, so the header types match.
http = { version = "1", optional = true }
url = { version = "2", optional = true }
# The client-direction codec (request encode + reply/push/hello decode). The
# codec owns all JSON, keeping `jeliya-client`'s no-`serde_json::Value` rule.
jeliya-codec = { path = "../jeliya-codec", optional = true }
# The reusable supervisor target resolver (#170): the injected source of
# verified loopback endpoint + redacted token facts. The adapter holds only a
# `TargetResolver`, never a `Sidecar`, so it can dial but never kill a daemon.
jeliya-supervisor = { path = "../jeliya-supervisor", optional = true }

[dev-dependencies]
# `block_on` for the native behaviour suite; the `executor` feature is dev-only
# so it never reaches the library or the wasm build.
futures = { version = "0.3", features = ["std", "async-await", "executor"] }

[[example]]
name = "shared_component"
# Gating the example on `example` (which enables `mock` and the optional
# `dioxus`) keeps `cargo check --all-targets` from compiling Dioxus unless that
# feature is explicitly requested.
required-features = ["example"]

[[test]]
name = "seam"
# The seam behaviour suite drives the mock: skip compilation (not an error)
# when the mock feature is off. CI runs the suite explicitly with
# `cargo test -p jeliya-client --features mock`.
required-features = ["mock"]

[[test]]
name = "kernel_fault"
# Explicit fault coverage for the bounded kernel (#168 §8 verification
# bullets): stop from each lifecycle phase, gate-refused terminal path,
# connected-after-stop race, and in-flight throttle invariant. Drives the
# deterministic in-memory controller, so CI runs:
# `cargo test -p jeliya-client --features test-transport`
required-features = ["test-transport"]

[[test]]
name = "reconcile_driver"
# End-to-end tests for the async reconciler driver (#169 §7 step 10):
# bootstrap, reconnect, resume, overflow recovery, and clean stop — each
# running the full Reconciler::run() loop against the deterministic mock backend
# via futures::executor::LocalPool (clock-free, no tokio). CI runs:
# `cargo test -p jeliya-client --features mock`
required-features = ["mock"]

[[test]]
name = "ws_native_adapter"
# Deterministic integration tests for the native WebSocket adapter (#172): an
# in-process fake `jeliyad` (loopback TCP listener + minimal WS handshake +
# scripted hello) drives the full dial → hello → serve pipeline without external
# services. Tests cover terminal/transient resolve paths, the hello gate, and
# the stop/cleanup invariants. CI runs:
# `cargo test -p jeliya-client --features ws-native`
required-features = ["ws-native"]
