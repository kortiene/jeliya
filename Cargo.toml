[workspace]
# `jeliya-ffi` is quarantined out of the active build under #166: it consumes
# the retired v1 string seam (`Engine::handle_frame`) and is removed from the
# workspace so `cargo build`/`cargo test`/`clippy --workspace` no longer build
# or test it. It is deleted outright under #202 once the Android DirectClient
# candidate passes. The crate stays on disk (excluded, not a member) so the
# retirement slice owns the removal atomically.
members = ["crates/jeliya-core", "crates/jeliyad", "crates/jeliya-api", "crates/jeliya-codec", "crates/jeliya-client", "crates/jeliya-ui", "crates/jeliya-platform"]
exclude = ["crates/jeliya-ffi"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.91"

[workspace.dependencies]
# Pinned to the upstream terminal-removal delivery fix, which includes the
# provisional-peer gate, store-insert recovery, and connection-generation
# hardening required by Jeliya's live lifecycle tests. This revision is
# deliberately untagged until the upstream release containing those fixes.
iroh-rooms = { git = "https://github.com/kortiene/iroh-room", rev = "52a4c89e900c2b065f7112638acedeccab83952f", features = ["experimental"] }

[workspace.lints.rust]
unsafe_code = "forbid"
